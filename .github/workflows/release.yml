name: Release Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*" # Trigger on semantic version tags (v1.0.0, etc.)

permissions:
  contents: write

jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout with Submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0 # Needed for version tagging

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev nasm

      - name: Build (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x scripts/build-ubuntu.sh
          ./scripts/build-ubuntu.sh

      - name: Build (Windows)
        if: matrix.os == 'windows-2025'
        run: |
          ./scripts/build-windows.ps1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCSakura-${{ runner.os }}
          path: |
            ./CCSakura-Win/
            ./CCSakura.app/
            ./CCSakura-linux.tar.gz
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: "CCSakura-*"
          merge-multiples: true

      - name: List Downloaded Artifacts
        run: ls -R downloaded

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: CHANGELOG.md
          files: |
            downloaded/*
