name: Release Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*" # Trigger on semantic version tags (v1.0.0, etc.)
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, macos-latest, self-hosted]
        include:
          - os: self-hosted
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout with Submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0 # Needed for version tagging

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev nasm

      - name: Cache CMake dependency source code
        uses: actions/cache@v4
        env:
          cache-name: cache-cmake-dependency-sources
        with:
          path: ${{github.workspace}}/build
          key: ${{ runner.os }}-${{ hashFiles('./CMakeLists.txt') }}

      - name: Build with CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          cmake --build build --config Release

      - name: Package artifacts (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p CCSakura-Linux
          mv -v build/bin/* CCSakura-Linux
          mv -v build/lib/* CCSakura-Linux
          cp -R -v assets CCSakura-Linux

      - name: Package artifacts (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          mv build/bin/CCSakura.app CCSakura.app
          mkdir -p CCSakura.app/Contents/Frameworks
          mkdir -p CCSakura.app/Contents/Resources
          mv -v build/lib/* CCSakura.app/Contents/Frameworks
          cp -R -v assets CCSakura.app/Contents/Resources
          install_name_tool -add_rpath "@executable_path/../Frameworks" "./CCSakura.app/Contents/MacOS/CCSakura"

      - name: Package artifacts (Windows)
        if: matrix.os == 'self-hosted'
        run: |
          mkdir -p CCSakura-Win
          mv -Verbose "build\bin\Release\*" "CCSakura-Win"
          mv -Verbose "build\lib\Release\*" "CCSakura-Win"
          cp -Path assets -Destination "CCSakura-Win\assets" -Recurse -Verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CCSakura-${{ runner.os }}
          path: |
            ./CCSakura-Win/
            ./CCSakura.app/
            ./CCSakura-Linux/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: success() && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: "CCSakura-*"
          merge-multiples: true

      - name: List Downloaded Artifacts
        run: ls -R downloaded

      - name: Archive files for release
        run: |
          tar -czvf downloaded/CCSakura-Linux.tar.gz downloaded/CCSakura-Linux/CCSakura-Linux/*
          zip -v -r downloaded/CCSakura-MacOS.zip downloaded/CCSakura-MacOS/CCSakura.app
          zip -v -r downloaded/CCSakura-Win.zip downloaded/CCSakura-Win/CCSakura-Win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: CHANGELOG.md
          files: |
            downloaded/CCSakura-Linux.tar.gz
            downloaded/CCSakura-MacOS.zip
            downloaded/CCSakura-Win.zip
